<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hanami · Browser walkthroughs</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#172d29;color:#efe7d1;font:15px system-ui,sans-serif}header{position:sticky;top:0;z-index:2;background:#203c33;padding:14px 22px;border-bottom:1px solid #798d75;display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font:25px Georgia;margin:0}select,button,input{font:inherit}select,button{background:#304a3e;color:inherit;border:1px solid #84987a;border-radius:4px;padding:8px}select{max-width:100%}button{cursor:pointer}a{color:#e9d7a9}main{padding:20px}h2{font:24px Georgia;margin:0 0 8px}.status{color:#bbcbb6;margin:0 0 18px}.toolbar{display:flex;align-items:center;gap:12px;flex:1}input{width:100%;min-width:80px}.views{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:20px}.view{min-width:0;background:#203c33;padding:12px;border:1px solid #425f4c;border-radius:5px}.view h3{margin:0 0 10px;font-size:15px}.view img{width:auto;max-width:100%;height:auto;display:block;margin-inline:auto}.view[data-phone=true]{overflow:auto}.view[data-phone=true] img{max-width:none}.view>a{display:block}details{margin-top:12px}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:600px;overflow:auto;font:11px/1.5 monospace}#position{min-width:65px;text-align:center}small{color:#bbcbb6}#error{color:#ffd0be}
</style>
<header><h1>Hanami walkthroughs</h1><select id="story" aria-label="Walkthrough"></select><a id="readme">README</a><div class="toolbar"><button id="prev" aria-label="Previous step">←</button><input id="step" type="range" min="0" value="0" aria-label="Step"><span id="position"></span><button id="next" aria-label="Next step">→</button></div></header>
<main><h2 id="title">Loading walkthroughs…</h2><p class="status" id="description"></p><p id="error"></p><div class="views" id="views"></div></main>
<script type="module">
const $=s=>document.querySelector(s);let stories=[],current=null,index=0;
const base=new URL('.',location.href),url=path=>new URL(path,base).href;
function show(){
 const step=current.steps[index];$('#title').textContent=`${step.number}. ${step.description}`;$('#description').textContent=`${step.actor} · Assertions passed · All actor/observer views · Exact RGBA and DOM verification`;
 $('#step').max=current.steps.length-1;$('#step').value=index;$('#position').textContent=`${index+1} / ${current.steps.length}`;$('#prev').disabled=index===0;$('#next').disabled=index===current.steps.length-1;$('#views').replaceChildren();
 for(const view of step.views){
  const panel=document.createElement('section');panel.className='view';const name=document.createElement('h3');name.textContent=view.name;panel.append(name);
  const link=document.createElement('a');link.href=url(view.image);link.target='_blank';link.rel='noopener';const img=document.createElement('img');img.addEventListener('load',()=>{const phone=Math.max(img.naturalWidth,img.naturalHeight)<=950&&Math.min(img.naturalWidth,img.naturalHeight)<=500;panel.dataset.phone=String(phone);if(phone)name.textContent=`${view.name} · ${img.naturalWidth} × ${img.naturalHeight} · 1:1`;});img.src=link.href;img.alt=`${view.name}: ${step.description}`;link.append(img);panel.append(link);
  const details=document.createElement('details'),summary=document.createElement('summary'),pre=document.createElement('pre');summary.textContent='Validated accessible DOM';details.append(summary,pre);details.addEventListener('toggle',async()=>{if(details.open&&!pre.textContent)pre.textContent=await (await fetch(url(view.dom))).text();});panel.append(details);$('#views').append(panel);
 }
 location.hash=`${current.id}/${current.platform}/${index}`;
}
async function load(story,indexToShow=0){current=await (await fetch(url(story.manifest))).json();index=Math.min(indexToShow,current.steps.length-1);$('#readme').href=url(story.readme);show();}
$('#story').addEventListener('change',()=>load(stories[$('#story').value]));$('#step').addEventListener('input',()=>{index=Number($('#step').value);show();});$('#prev').onclick=()=>{if(index>0){index--;show();}};$('#next').onclick=()=>{if(index<current.steps.length-1){index++;show();}};document.addEventListener('keydown',e=>{if(e.target.matches('input,select'))return;if(e.key==='ArrowLeft')$('#prev').click();if(e.key==='ArrowRight')$('#next').click();});
try{const response=await fetch(url('walkthroughs/index.json'));if(!response.ok)throw Error('Walkthrough references have not been generated yet.');stories=await response.json();for(const [i,s]of stories.entries()){const option=document.createElement('option');option.value=i;option.textContent=`${s.title} · ${s.platform} · ${s.steps} steps`;$('#story').append(option);}const hash=location.hash.slice(1).split('/');let selected=stories.findIndex(s=>s.manifest.includes(`${hash[0]}/${hash[1]}/`));if(selected<0)selected=0;$('#story').value=selected;await load(stories[selected],Number(hash[2])||0);}catch(e){$('#title').textContent='Walkthroughs unavailable';$('#error').textContent=e.message;}
</script></html>
